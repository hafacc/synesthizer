name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      upload-pages:
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # LFS audio/image assets are only needed when producing the deploy artifact
          lfs: ${{ inputs.upload-pages }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun lint
      - id: pages
        if: inputs.upload-pages
        uses: actions/configure-pages@v6
      - run: bun export
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - if: inputs.upload-pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build
